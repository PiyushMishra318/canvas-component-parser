<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta http-equiv='X-UA-Compatible' content='ie=edge'>
    <title>Title</title>
    <style>
      html,
      body {
        text-align: center;
      }

      .container-buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        padding: 20px 200px;
      }

      .btn {
        font-weight: bold;
        background-color: lightgreen;
        padding: 15px 35px;
        border-radius: 12px;
        border-style: none;
        box-shadow: 2px 2px darkgreen;
      }

      .btn:hover {
        background-color: green;
        transition: 0.5s;
      }

      .btn:active {
        background-color: darkgreen;
        box-shadow: 0px 0px darkgreen;
      }
    </style>
  </head>
  <body>
    <div data-component='App'>
      <h1>Ron Swanson Quote Generator</h1>
      <p>(4 ways to write an ajax response)</p>
      <section class='container-buttons'>
        <button class='btn' id='btn-xhr' onclick='clickXHR()'>XHR</button>
        <button class='btn' id='btn-fetch' onclick='clickFetch()'>Fetch</button>
        <button class='btn' id='btn-jquery'>jQuery</button>
        <button class='btn' id='btnAxios' onclick='clickAxios()'>Axios</button>
      </section>
      <h2 id='text-ronsQuote'></h2>
    </div>
    <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js'></script>
    <script src='https://unpkg.com/axios/dist/axios.min.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js'></script>
    <script type='text/babel'>
      //replace
      /*XHR*/
      function clickXHR() {
        var XHR = new XMLHttpRequest();
        XHR.onreadystatechange = function() {
          if (this.readyState == 4 && this.status == 200) {
            document.getElementById("text-ronsQuote").innerHTML = JSON.parse(
              this.responseText
            );
          }
        };
        XHR.open("GET", "https://ron-swanson-quotes.herokuapp.com/v2/quotes");
        XHR.send();
      }

      /*FETCH*/

      function clickFetch() {
        fetch("https://ron-swanson-quotes.herokuapp.com/v2/quotes")
          .then(function(response) {
            return response.json();
          })
          .then(function(ronJson) {
            document.getElementById("text-ronsQuote").innerHTML = ronJson;
          });
      }

      /*jQuery*/

      $("#btn-jquery").click(function() {
        $.ajax({
          url: "https://ron-swanson-quotes.herokuapp.com/v2/quotes",
          cache: false
        }).done(function(html) {
          $("#text-ronsQuote").append(html);
        });
      });

      /* Axios */

      function clickAxios() {
        axios
          .get("https://ron-swanson-quotes.herokuapp.com/v2/quotes")
          .then(function(response) {
            document.getElementById("text-ronsQuote").innerHTML =
              response.data[0];
          });
      }
    </script>
  </body>
</html>
